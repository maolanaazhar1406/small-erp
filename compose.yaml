services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "${APP_PORT}:${APP_CONTAINER_PORT}"

    environment:
      APP_PORT: ${APP_PORT}
      APP_ENV: ${APP_ENV}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS}

    depends_on:
      db:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:${APP_CONTAINER_PORT}/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - erp-network

  db:
    image: ${POSTGRES_IMAGE}

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "${DB_EXTERNAL_PORT}:${DB_PORT}"

    volumes:
      - erp_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - erp-network

  migrate:
    image: ${MIGRATE_IMAGE}

    volumes:
      - ./migrations:${MIGRATION_PATH}

    command:
      - "-path"
      - "${MIGRATION_PATH}"
      - "-database"
      - "postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}"
      - "up"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - erp-network

volumes:
  erp_data:

networks:
  erp-network:
    driver: bridge